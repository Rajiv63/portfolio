<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="container">
    <div class="navbar-inner">
      <ul class="nav-links desktop-only">
        @for (link of navLinks; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              class="nav-link"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <a routerLink="/contact" class="nav-cta desktop-only">Let's talk <span>↗</span></a>

      <button
        class="hamburger mobile-only"
        [class.open]="isMobileMenuOpen"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-label="Toggle navigation menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" [class.open]="isMobileMenuOpen">
    <div class="mobile-menu-head">
      <span>Navigation</span>
      <span>00 — 07</span>
    </div>
    <ul>
      @for (link of navLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            (click)="closeMobileMenu()"
          >
            <span class="mobile-index">0{{ $index + 1 }}</span>
            <span>{{ link.label }}</span>
            <span class="mobile-arrow">↗</span>
          </a>
        </li>
      }
    </ul>
    <a routerLink="/contact" class="mobile-cta" (click)="closeMobileMenu()">Start a conversation <span>↗</span></a>
  </div>
</nav>

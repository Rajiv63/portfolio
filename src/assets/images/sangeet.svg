<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Sangeet Music Streaming Platform</title>
  <desc id="desc">Vinyl disc with equalizer audio waves and music note in vibrant Spotify emerald green</desc>
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="70%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" rx="24" fill="#090d16" />
  <rect x="12" y="12" width="616" height="336" rx="18" fill="url(#glowGrad)" stroke="#1db954" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Vinyl Record Disc -->
  <g transform="translate(230, 180)">
    <!-- Outer Glow -->
    <circle r="120" fill="#1db954" opacity="0.12" filter="url(#glow)" />
    <!-- Record Body -->
    <circle r="114" fill="url(#discGrad)" stroke="#1db954" stroke-opacity="0.6" stroke-width="2.5" />
    <!-- Grooves -->
    <circle r="98" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
    <circle r="84" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="3 4" opacity="0.5" />
    <circle r="70" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
    <circle r="56" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="5 7" opacity="0.4" />
    <!-- Center Label -->
    <circle r="40" fill="url(#neonGreen)" />
    <!-- Center Hole -->
    <circle r="10" fill="#090d16" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" />
    <circle r="4" fill="#ffffff" />
  </g>

  <!-- Equalizer Audio Visualizer (Left) -->
  <g transform="translate(68, 120)">
    <rect x="0" y="50" width="8" height="60" rx="4" fill="#1db954" opacity="0.8" />
    <rect x="14" y="25" width="8" height="85" rx="4" fill="#1db954" />
    <rect x="28" y="10" width="8" height="100" rx="4" fill="#1ed760" filter="url(#glow)" />
    <rect x="42" y="40" width="8" height="70" rx="4" fill="#1db954" opacity="0.85" />
    <rect x="56" y="65" width="8" height="45" rx="4" fill="#10b981" opacity="0.7" />
  </g>

  <!-- Equalizer Audio Visualizer (Right) -->
  <g transform="translate(490, 120)">
    <rect x="0" y="65" width="8" height="45" rx="4" fill="#10b981" opacity="0.7" />
    <rect x="14" y="30" width="8" height="80" rx="4" fill="#1db954" opacity="0.85" />
    <rect x="28" y="8" width="8" height="102" rx="4" fill="#1ed760" filter="url(#glow)" />
    <rect x="42" y="35" width="8" height="75" rx="4" fill="#1db954" />
    <rect x="56" y="55" width="8" height="55" rx="4" fill="#1db954" opacity="0.8" />
  </g>

  <!-- Sound Waves / Beats Header -->
  <path d="M70 70 Q 200 45, 320 65 T 570 70" fill="none" stroke="#1db954" stroke-width="2" stroke-dasharray="6 8" opacity="0.4" />
  <path d="M70 290 Q 200 315, 320 295 T 570 290" fill="none" stroke="#1db954" stroke-width="2" stroke-dasharray="6 8" opacity="0.4" />
</svg>
